<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>จดครบ</title>
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="จดครบ">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=19">
</head>
<body>
  <header class="top">
    <div>
      <h1>จดครบ</h1>
      <p id="today" class="sub"></p>
      <p id="quota" class="quota" hidden></p>
    </div>
    <div class="top-actions">
      <a href="bills.html" class="icon-btn" title="เบิกเงิน" aria-label="เบิกเงิน">🧾</a>
      <a href="vault.html" class="icon-btn" title="รหัสผ่าน" aria-label="รหัสผ่าน">🔐</a>
      <button id="btnMeet" class="icon-btn" title="ดึงประชุมจาก Calendar" aria-label="ดึงประชุม">👥</button>
      <button id="btnView" class="icon-btn" title="ดูแบบปฏิทิน" aria-label="สลับมุมมอง">📅</button>
      <button id="btnSync" class="icon-btn" title="รีเฟรช" aria-label="รีเฟรช">⟳</button>
      <button id="btnSettings" class="icon-btn" title="ตั้งค่า" aria-label="ตั้งค่า">⚙</button>
    </div>
  </header>

  <form id="quick" class="quick" autocomplete="off">
    <input id="quickInput" type="text" placeholder="พิมพ์รายละเอียดงาน แล้วกด ＋" enterkeyhint="next">
    <button type="submit" class="add-btn" aria-label="เพิ่ม">＋</button>
  </form>

  <nav id="chips" class="chips" aria-label="กรองตามโปรเจ็ค"></nav>

  <div class="search">
    <input id="searchInput" type="search" placeholder="🔍 ค้นหางาน โน้ต หรือโปรเจ็ค" enterkeyhint="search" aria-label="ค้นหา">
  </div>

  <div id="status" class="status" hidden></div>

  <main id="list"></main>

  <!-- แก้ไขงาน -->
  <dialog id="editDlg">
    <form id="editForm" method="dialog">
      <h2 id="editTitle">งาน</h2>
      <label>รายละเอียดงาน
        <textarea name="title" rows="2" required></textarea>
      </label>
      <div class="field">
        <span class="field-label">เมื่อไหร่</span>
        <div class="when-chips wrap" id="eWhen">
          <button type="button" data-k="today">วันนี้</button>
          <button type="button" data-k="tomorrow">พรุ่งนี้</button>
          <button type="button" data-k="date">📅 เลือกวัน</button>
          <button type="button" data-k="week">ภายในสัปดาห์นี้</button>
          <button type="button" data-k="month">ภายในเดือนนี้</button>
          <button type="button" data-k="before">ก่อนงาน…</button>
          <button type="button" data-k="unsure">ไม่แน่ใจ</button>
        </div>
      </div>
      <label id="eDepRow">ต้องเสร็จก่อนงานอะไร
        <input name="dep" list="depList" placeholder="พิมพ์ชื่องาน เช่น งานสัมมนา" autocomplete="off">
        <datalist id="depList"></datalist>
      </label>
      <div class="row" id="eDateRow">
        <label><span id="eDateLabel">วันที่</span>
          <input name="date" type="date">
        </label>
        <label id="eTimeWrap">เวลา
          <input name="time" type="time">
        </label>
      </div>
      <div class="field" id="ePreRow">
        <span class="field-label">เตือนล่วงหน้ากี่วัน (เลือกได้หลายอัน · รวมในสรุปตอนเช้าทาง LINE)</span>
        <div class="when-chips wrap pre-chips" id="ePre">
          <button type="button" data-d="1">1 วัน</button>
          <button type="button" data-d="2">2 วัน</button>
          <button type="button" data-d="3">3 วัน</button>
          <button type="button" data-d="4">4 วัน</button>
          <button type="button" data-d="5">5 วัน</button>
          <button type="button" data-d="6">6 วัน</button>
          <button type="button" data-d="7">7 วัน</button>
        </div>
      </div>
      <label>โปรเจ็ค / บริษัท
        <input name="project" list="projectList" placeholder="ไม่ระบุ">
        <datalist id="projectList"></datalist>
      </label>
      <label class="check">
        <input name="remind" type="checkbox"> เตือนทาง LINE ตามเวลา
      </label>
      <label>โน้ต
        <textarea name="note" rows="3"></textarea>
      </label>
      <div class="dlg-actions">
        <button type="button" id="btnDelete" class="danger">ลบ</button>
        <span class="spacer"></span>
        <button type="button" id="btnCancel" class="ghost">ยกเลิก</button>
        <button type="submit" class="primary" id="btnSave">บันทึก</button>
      </div>
    </form>
  </dialog>

  <!-- ดึงประชุมจาก Google Calendar -->
  <dialog id="meetDlg">
    <form id="meetForm" method="dialog">
      <h2>ประชุมจาก Calendar</h2>
      <p class="hint">14 วันข้างหน้า ติ๊กอันที่จะเข้า แล้วจะเพิ่มเป็นงานพร้อมเตือนทาง LINE</p>
      <div id="meetList" class="meet-list"></div>
      <label>ใส่โปรเจ็ค (ไม่บังคับ)
        <input name="project" list="projectList" placeholder="ไม่ระบุ">
      </label>
      <div class="dlg-actions">
        <span class="spacer"></span>
        <button type="button" id="btnMeetCancel" class="ghost">ปิด</button>
        <button type="submit" id="btnMeetAdd" class="primary">เพิ่มเป็นงาน</button>
      </div>
    </form>
  </dialog>

  <!-- ตั้งค่า -->
  <dialog id="setDlg">
    <form id="setForm" method="dialog">
      <h2>เชื่อมเครื่องนี้</h2>
      <p class="hint" id="setState"></p>
      <label>ลิงก์จาก LINE
        <input name="key" autocomplete="off" placeholder="วางลิงก์จาก LINE ที่นี่">
      </label>
      <p class="hint">พิมพ์ <b>ลิงก์</b> ในแชท LINE OA แล้วคัดลอกลิงก์ที่ได้มาวาง หรือแตะเปิดลิงก์นั้นตรงๆ ก็ได้</p>
      <button type="button" id="btnCopyLink" class="ghost wide">📋 คัดลอกลิงก์สำหรับเครื่องอื่น</button>
      <details class="adv">
        <summary>ขั้นสูง</summary>
        <label>Web app URL
          <input name="url" type="url">
        </label>
      </details>
      <div class="dlg-actions">
        <span class="spacer"></span>
        <button type="button" id="btnSetCancel" class="ghost">ปิด</button>
        <button type="submit" class="primary">บันทึก</button>
      </div>
    </form>
  </dialog>

  <script src="app.js?v=19"></script>
</body>
</html>
