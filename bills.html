<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>เบิกเงิน · จดครบ</title>
  <meta name="theme-color" content="#0f766e">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20">
</head>
<body class="bills">
  <header class="top">
    <div>
      <a href="./" class="back" id="vToApp">‹ จดครบ</a>
      <button type="button" class="back back-btn" id="vBack" hidden>‹ หน้าหลักเบิกเงิน</button>
      <h1 id="vTitle">เบิกเงิน</h1>
      <p class="sub" id="vSub">จดไว้ก่อน หลักฐานค่อยตามมา</p>
    </div>
    <div class="top-actions">
      <button id="btnSync" class="icon-btn" title="รีเฟรช" aria-label="รีเฟรช">⟳</button>
    </div>
  </header>

  <!-- เลือกเดือน (เปิดมาที่เดือนปัจจุบัน) ใช้ทุกหน้า -->
  <div class="m-bar">
    <button id="mPrev" class="icon-btn" aria-label="เดือนก่อน">‹</button>
    <button id="mLabel" class="m-label" title="กลับไปเดือนนี้"></button>
    <button id="mNext" class="icon-btn" aria-label="เดือนถัดไป">›</button>
  </div>
  <p class="m-total" id="mTotal"></p>
  <div id="status" class="status" hidden></div>
  <div id="mOlder" class="m-older" hidden></div>

  <!-- ===== หน้าหลักเบิกเงิน ===== -->
  <section id="vHome">
    <form id="bQuick" class="quick" autocomplete="off">
      <input id="bInput" type="text" placeholder="เช่น 350 ค่าแท็กซี่ #บริษัทA" enterkeyhint="done">
      <button type="submit" class="add-btn" aria-label="จดบิล">＋</button>
    </form>
    <button type="button" id="btnSnap" class="snap-big">
      <span class="sb-ico">📷</span>
      <span><b>ถ่ายรูป / แนบใบเสร็จ</b><small>อ่านวันที่ ยอดเงิน ชื่อร้านให้อัตโนมัติ</small></span>
    </button>

    <div class="b-tiles four" id="tiles">
      <button class="b-tile" data-st="draft"><span class="lbl">📝 ขาดหลักฐาน</span><b class="amt">฿0</b><span class="cnt">0 รายการ</span></button>
      <button class="b-tile" data-st="ready"><span class="lbl">📎 พร้อมเบิก</span><b class="amt">฿0</b><span class="cnt">0 รายการ</span></button>
      <button class="b-tile" data-st="submitted"><span class="lbl">📤 รอเงินคืน</span><b class="amt">฿0</b><span class="cnt">0 รายการ</span></button>
      <button class="b-tile" data-st="paid"><span class="lbl">✅ ได้คืนแล้ว</span><b class="amt">฿0</b><span class="cnt">0 รายการ</span></button>
    </div>

    <div class="h-links">
      <button class="h-link" id="goClaim" hidden><span>📤 สร้างใบเบิก</span><small id="goClaimN"></small><b>›</b></button>
      <button class="h-link" id="goSum"><span>📊 สรุปและดูย้อนหลัง</span><small>ยอดรวม · กราฟ 12 เดือน · แยกหมวด</small><b>›</b></button>
    </div>

    <section class="group">
      <h3 class="h-recent"><span>ล่าสุดเดือนนี้</span><button class="link-btn" id="goAll">ดูทั้งหมด ›</button></h3>
      <div id="hRecent"></div>
    </section>
  </section>

  <!-- ===== หน้าย่อย: รายการตามสถานะ ===== -->
  <section id="vList" hidden>
    <nav id="bTabs" class="chips" aria-label="สถานะ">
      <button class="chip" data-st="draft">📝 ขาดหลักฐาน</button>
      <button class="chip" data-st="ready">📎 พร้อมเบิก</button>
      <button class="chip" data-st="submitted">📤 ยื่นแล้ว</button>
      <button class="chip" data-st="paid">✅ ได้เงินแล้ว</button>
      <button class="chip" data-st="all">ทั้งหมด</button>
    </nav>
    <main id="bList"></main>
    <div id="bBar" class="b-bar" hidden>
      <button id="btnClaim" class="btn primary">สร้างใบเบิก</button>
    </div>
  </section>

  <!-- ===== หน้าย่อย: สรุป ===== -->
  <section id="vSum" hidden></section>

  <!-- แก้ไขบิล -->
  <dialog id="bDlg">
    <form id="bForm" method="dialog" autocomplete="off">
      <h2 id="bDlgTitle">รายละเอียด</h2>
      <div id="bSuggest" class="b-suggest" hidden></div>
      <div class="row">
        <label>วันที่จ่าย <input name="date" type="date" required></label>
        <label>จำนวนเงิน (บาท) <input name="amount" inputmode="decimal" required></label>
      </div>
      <label>รายละเอียด <input name="desc" required></label>
      <div class="row">
        <label>โปรเจ็ค / บริษัท <input name="project" list="bProjList" placeholder="ไม่ระบุ"><datalist id="bProjList"></datalist></label>
      </div>
      <div class="field">
        <label>หมวด <input name="cat" placeholder="แตะเลือกด้านล่าง หรือพิมพ์หมวดเอง"></label>
        <div id="bCats" class="when-chips wrap"></div>
      </div>
      <div class="row">
        <label>จ่ายด้วย
          <select name="pay"><option value="">-</option><option>เงินสด</option><option>โอน</option><option>บัตรเครดิต</option><option>QR/พร้อมเพย์</option></select>
        </label>
        <label>ร้าน / ผู้ขาย <input name="vendor"></label>
      </div>

      <div class="field">
        <span class="field-label">หลักฐาน</span>
        <div id="bFiles" class="b-files"></div>
        <button type="button" id="btnAttach" class="wide">📎 แนบหลักฐาน</button>
      </div>

      <label>สถานะ
        <select name="status">
          <option value="draft">📝 ขาดหลักฐาน</option>
          <option value="ready">📎 พร้อมเบิก</option>
          <option value="submitted">📤 ยื่นเบิกแล้ว</option>
          <option value="paid">✅ ได้เงินคืนแล้ว</option>
        </select>
      </label>
      <label>โน้ต <textarea name="note" rows="2"></textarea></label>
      <div class="dlg-actions">
        <button type="button" id="btnBDelete" class="danger">ลบ</button>
        <span class="spacer"></span>
        <button type="button" id="btnBCancel" class="ghost">ปิด</button>
        <button type="submit" class="primary">บันทึก</button>
      </div>
    </form>
  </dialog>

  <!-- เลือกชนิดหลักฐาน -->
  <dialog id="kDlg">
    <form method="dialog" class="k-form">
      <h2>แนบหลักฐานอะไร</h2>
      <p class="hint" id="kFor"></p>
      <div class="k-grid">
        <button type="button" data-kind="taxinv">🧾<span>ใบกำกับภาษี</span></button>
        <button type="button" data-kind="receipt">🧾<span>ใบเสร็จ</span></button>
        <button type="button" data-kind="slip">📷<span>สลิป / รูปแคป</span></button>
        <button type="button" data-kind="cert">✍️<span>ใบรับรองแทนใบเสร็จ</span></button>
        <button type="button" data-kind="other">📄<span>อื่นๆ</span></button>
      </div>
      <p class="hint">เลือกแล้วถ่ายรูป หรือเลือกรูป/PDF จากเครื่อง ได้หลายไฟล์</p>
      <div class="dlg-actions"><span class="spacer"></span><button type="button" id="btnKCancel" class="ghost">ยกเลิก</button></div>
    </form>
  </dialog>
  <!-- กำลังอ่านใบเสร็จ -->
  <div id="busy" class="busy" hidden role="status" aria-live="polite">
    <div class="busy-card">
      <img id="busyImg" alt="" hidden>
      <div class="spin"></div>
      <b id="busyMsg">กำลังอ่านใบเสร็จ…</b>
      <small id="busySub"></small>
    </div>
  </div>
  <input type="file" id="bFile" accept="image/*,application/pdf" multiple hidden>

  <!-- ใบเบิก -->
  <dialog id="cDlg" class="wide-dlg">
    <form method="dialog" id="cForm">
      <h2>สร้างใบเบิก</h2>
      <label>โปรเจ็ค / บริษัท
        <select id="cProj"></select>
      </label>
      <div id="cList" class="c-list"></div>
      <p class="c-total">รวม <b id="cTotal">฿0</b></p>
      <div class="c-actions">
        <button type="button" id="btnPrint" class="wide">🖨 พิมพ์ / บันทึก PDF</button>
        <button type="button" id="btnCopy" class="wide">📋 คัดลอกตาราง (วางใน Excel/อีเมล)</button>
      </div>
      <div class="dlg-actions">
        <span class="spacer"></span>
        <button type="button" id="btnCCancel" class="ghost">ปิด</button>
        <button type="button" id="btnSubmitted" class="primary">📤 ยื่นเบิกแล้ว</button>
      </div>
    </form>
  </dialog>

  <script src="bills.js?v=20"></script>
</body>
</html>
