<!doctype html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan &amp; Shop by TIBD</title>
<meta name="description" content="ร้านค้าของบริษัท ทีไอบีดี จำกัด สแกน เลือก จ่าย จบในมือถือ">
<meta name="theme-color" content="#f6f5f0">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f0; --card:#ffffff; --sunk:#f1efe8; --ink:#14233b; --ink2:#33415a; --muted:#6b778c; --line:#e7e5dd;
    --coral:#e8572f; --coral-dk:#cc4520; --coral-soft:#fde9e2; --mint:#6fd6b6; --mint-deep:#1b8a6b; --mint-soft:#e4f6ef;
    --warn:#8a5a00; --warn-bg:#fff3d6; --bad:#b42318; --bad-bg:#fdecea;
    --shadow:0 1px 2px rgba(20,35,59,.05),0 10px 24px -14px rgba(20,35,59,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Prompt","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.5}
  button{font:inherit;color:inherit}
  svg{display:block;flex:none}
  .frame{max-width:1040px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:112px}
  .narrow{max-width:520px;margin:0 auto}
  .banner{background:var(--warn-bg);color:var(--warn);font-size:12.5px;padding:6px 16px;text-align:center}
  main{padding:0 16px}
  h2{font-size:18px;margin:26px 0 12px;font-weight:700}
  .note{font-size:12.5px;color:var(--muted)}
  .err{color:var(--bad);font-size:13.5px;margin-top:12px;background:var(--bad-bg);border-radius:12px;padding:9px 12px}

  /* ---------- หน้าแรก ---------- */
  .home-head{padding:26px 16px 6px;text-align:left}
  .home-head .eyebrow,.eyerow .eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mint-deep);background:var(--mint-soft);border-radius:999px;padding:3px 10px;font-weight:500}
  .home-head h1{margin:10px 0 2px;font-size:30px;line-height:1.15;font-weight:700}
  .home-head p{margin:0;color:var(--muted)}
  .search{display:flex;align-items:center;gap:10px;height:46px;margin:0;font-size:15px;font-weight:400;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:0 8px 0 16px;color:var(--muted);transition:border-color .15s,box-shadow .15s}
  .search:focus-within{border-color:var(--mint);box-shadow:0 0 0 4px rgba(111,214,182,.22)}
  .search input[type=text]{border:0;outline:0;background:none;padding:0;height:100%;font:inherit;font-size:16px;color:var(--ink);flex:1;min-width:0;border-radius:0}
  .search input[type=text]:focus{outline:0}
  .search input::placeholder{color:#a3a9b5}
  .search .clear{border:0;background:var(--sunk);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
  .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .bcard{position:relative;border-radius:20px;overflow:hidden;cursor:pointer;background:var(--ink);box-shadow:var(--shadow);aspect-ratio:16/10;border:0;padding:0;text-align:left;display:block;width:100%}
  .bcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
  .bcard:hover img{transform:scale(1.04)}
  .bcard .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(14,24,40,.86) 0%,rgba(14,24,40,.35) 45%,rgba(14,24,40,0) 70%)}
  .bcard .txt{position:absolute;left:18px;right:18px;bottom:16px;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  .bcard .txt b{display:block;font-size:24px;line-height:1.1;letter-spacing:.3px}
  .bcard .txt span{font-size:13px;opacity:.85;letter-spacing:1px}
  .bcard .go{flex:none;background:#fff;color:var(--ink);border-radius:999px;padding:7px 12px 7px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
  .bcard.noimg{background:linear-gradient(135deg,var(--mint-deep),#0f5a46)}
  .mast{background:radial-gradient(120% 140% at 0% 0%,#e3f6ee 0%,rgba(227,246,238,0) 55%),radial-gradient(120% 140% at 100% 0%,#fde9e2 0%,rgba(253,233,226,0) 50%),var(--bg);border-bottom:1px solid var(--line)}
  .mast-in{max-width:1040px;margin:0 auto;padding:28px 16px 18px;display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
  .mast-t{min-width:0}
  .mast-t h1{margin:10px 0 2px;font-size:32px;line-height:1.15;font-weight:700;letter-spacing:-.2px}
  .mast-t p{margin:0;color:var(--muted);font-size:14px}
  .mast .mast-s{flex:0 1 440px;min-width:280px}
  .mast-s.under{padding:14px 16px 0}
  .infobar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:16px 0 12px;font-size:13.5px;color:var(--muted);min-height:30px}
  .infobar b{color:var(--ink);font-weight:600}
  .infobar .active{padding:0}
  .layout{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}
  .sidebar{position:sticky;top:12px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:6px 10px 12px;max-height:calc(100vh - 24px);overflow:auto}
  .results{min-width:0}
  .fp h4{margin:14px 6px 6px;font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .fp h4 span{font-weight:400}
  .fp button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:11px;padding:8px 10px;cursor:pointer;text-align:left;font-size:14.5px;color:var(--ink2)}
  .fp button:hover{background:var(--sunk)}
  .fp button.on{background:var(--mint-soft);color:var(--mint-deep);font-weight:600}
  .fp button span:not(.bi){flex:1;min-width:0}
  .fp button small{color:var(--muted);font-size:12px;font-weight:400}
  .fp .bi{width:30px;height:30px;border-radius:8px;overflow:hidden;flex:none;background:var(--mint-deep);position:relative}
  .fp .bi img{width:100%;height:100%;object-fit:cover}
  .fp .bi i{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-size:14px}
  .fp .fl{display:block;margin:4px 10px 0;font-size:12.5px;color:var(--mint-deep);cursor:pointer}
  .frow{display:flex;gap:8px;align-items:center}
  .frow .search{flex:1}
  .fbtn{display:none;align-items:center;justify-content:center;gap:6px;height:46px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;cursor:pointer;font-size:13.5px;color:var(--ink2);position:relative;white-space:nowrap;flex:none}
  .fbtn:active{background:var(--sunk)}
  @media (max-width:430px){ .fbtn span{display:none} .fbtn{width:46px;padding:0} }
  .fbtn i{font-style:normal;background:var(--coral);color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:11px;display:grid;place-items:center;font-weight:600;position:absolute;top:-4px;right:-4px;border:2px solid var(--bg)}
  .active{display:flex;gap:6px;flex-wrap:wrap;padding-top:10px}
  .active button{display:flex;align-items:center;gap:5px;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:5px 10px 5px 12px;font-size:13px;cursor:pointer}
  .ov.side{justify-content:flex-start;align-items:stretch}
  .drawer{background:var(--bg);width:min(320px,86vw);height:100%;display:flex;flex-direction:column;box-shadow:10px 0 30px -10px rgba(0,0,0,.3);animation:din .2s}
  @keyframes din{from{transform:translateX(-100%)}}
  .drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 6px}
  .drawer .dh b{font-size:17px}
  .drawer .x{border:0;background:var(--card);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
  .drawer .fp{flex:1;overflow:auto;padding:0 10px}
  .drawer .df{padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
  @media (max-width:760px){
    .layout{grid-template-columns:1fr;gap:0}
    .sidebar{display:none}
    .fbtn{display:flex}
    /* ให้ช่องค้นหาเป็นลูกของทั้งหน้า จะได้ติดด้านบนตลอดตอนเลื่อน */
    .mast,.mast-in{display:contents}
    .mast-t{padding:22px 16px 6px;background:radial-gradient(120% 140% at 0% 0%,#e3f6ee 0%,rgba(227,246,238,0) 60%),radial-gradient(120% 140% at 100% 0%,#fde9e2 0%,rgba(253,233,226,0) 55%)}
    .mast-t h1{font-size:27px}
    .mast .mast-s,.mast-s{min-width:0}
    /* มือถือ: ช่องค้นหาติดด้านบนตอนเลื่อน */
    .sticky{position:sticky;top:0;z-index:6;background:rgba(246,245,240,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 16px}
    .mast-s.under{padding:10px 16px}
    .infobar{margin-top:10px}
  }
  .bstrip{padding:16px 16px 0}
  .bstrip-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .bstrip-h b{font-size:15px}
  .bstrip-h button{display:flex;align-items:center;gap:2px;border:0;background:none;color:var(--mint-deep);font-size:13.5px;font-weight:500;cursor:pointer;padding:4px 0}
  .bstrip-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none} .bstrip-row::-webkit-scrollbar{display:none}
  .bmini{flex:none;width:132px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:0 0 10px;cursor:pointer;text-align:left;overflow:hidden;box-shadow:var(--shadow)}
  .bmini .bimg{display:block;height:64px;background:var(--mint-deep);position:relative;overflow:hidden}
  .bmini .bimg img{width:100%;height:100%;object-fit:cover;object-position:center 65%}
  .bmini .bimg i{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-style:normal;font-size:26px;font-weight:700}
  .bmini b{display:block;padding:8px 11px 0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bmini small{display:block;padding:0 11px;color:var(--muted);font-size:12px}
  .bmini:hover{border-color:var(--mint)}
  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .cat{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;text-align:left;font-weight:500}
  .cat:hover{border-color:var(--mint);background:#fbfffd}
  .cat small{color:var(--muted);font-weight:400}
  .allbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;background:none;border:1.5px dashed var(--line);border-radius:14px;padding:12px;cursor:pointer;color:var(--ink2);font-weight:500}
  .allbtn:hover{border-color:var(--mint-deep);color:var(--mint-deep)}

  /* ---------- หน้าแบรนด์ / สินค้า ---------- */
  .hero{position:relative;height:230px;overflow:hidden;background:var(--ink)}
  .hero img{width:100%;height:100%;object-fit:cover;object-position:center 65%}
  @media (min-width:900px){ .hero{height:340px} .hero img{object-position:center 55%} } /* จอกว้าง: หัวแบรนด์สูงขึ้น สินค้าไม่ถูกตัด */
  .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(14,24,40,.75),rgba(14,24,40,.05) 60%)}
  .hero .t{position:absolute;left:18px;right:18px;bottom:16px;color:#fff;z-index:1}
  .hero .t b{display:block;font-size:30px;line-height:1.1}
  .hero .t span{font-size:13.5px;letter-spacing:1.5px;opacity:.9}
  .hero.plain{height:auto;background:none;padding:20px 16px 0} .hero.plain:after{display:none}
  .hero.plain .t{position:static;color:var(--ink)} .hero.plain .t span{color:var(--muted);letter-spacing:0}
  .back{position:absolute;left:12px;top:12px;z-index:2;display:flex;align-items:center;gap:4px;border:0;background:rgba(255,255,255,.92);color:var(--ink);border-radius:999px;padding:7px 13px 7px 9px;font-size:13.5px;font-weight:500;cursor:pointer;box-shadow:0 4px 12px -4px rgba(0,0,0,.3)}
  .hero.plain .back{position:static;margin-bottom:12px;background:var(--card);border:1px solid var(--line);box-shadow:none}
  .filters{position:sticky;top:0;z-index:6;background:rgba(246,245,240,.94);backdrop-filter:blur(8px);padding:12px 0 8px}
  @media (max-width:760px){ .filters{padding:12px 16px 8px;margin:0 -16px} }
  .chipsx{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none} .chipsx::-webkit-scrollbar{display:none}
  .chipsx button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13.5px;cursor:pointer;color:var(--ink2);white-space:nowrap}
  .chipsx button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
  .chipsx button small{opacity:.65;margin-left:4px}
  .resinfo{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px;font-size:13px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .pic{position:relative;aspect-ratio:1/1;cursor:pointer;background:#fff;border-bottom:1px solid var(--line)}
  .pic img{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);object-fit:contain;transition:transform .3s}
  .card:hover .pic img{transform:scale(1.03)}
  .body .meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11.5px;line-height:1.3;margin-bottom:2px;min-width:0}
  .body .ct{color:var(--muted);background:var(--sunk);border-radius:999px;padding:1px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .body .dotsep{color:var(--line)}
  .ph{position:absolute;inset:14px;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;font-size:12px;color:#a9a79f}
  .body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:2px;flex:1}
  .body .bn{font-size:11.5px;color:var(--mint-deep);font-weight:600;letter-spacing:.4px}
  .body b{font-size:15px;line-height:1.3;font-weight:600;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .body .sz{font-size:12.5px;color:var(--muted)}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;min-height:44px;gap:6px}
  .price{font-weight:700;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .price small{font-size:12px;font-weight:500;color:var(--muted)}
  .soon{font-size:12px;color:var(--mint-deep);background:var(--mint-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
  .add{width:38px;height:38px;border-radius:12px;border:0;background:var(--coral);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 14px -6px rgba(232,87,47,.8)}
  .add:hover{background:var(--coral-dk)}
  .stp{display:flex;align-items:center;gap:2px;background:var(--coral-soft);border-radius:12px;padding:3px}
  .stp button{width:30px;height:30px;border-radius:9px;border:0;background:#fff;color:var(--coral);font-size:18px;line-height:1;cursor:pointer}
  .stp button.p{background:var(--coral);color:#fff}
  .stp .qn{width:34px;border:0;background:transparent;text-align:center;font:inherit;font-size:16px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;padding:4px 0;border-radius:7px;-moz-appearance:textfield}
  .stp .qn:focus{outline:2px solid var(--coral);background:#fff}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:32px 16px;text-align:center;color:var(--muted)}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

  /* ---------- แถบตะกร้าล่าง ---------- */
  .bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:8}
  .bar>div{pointer-events:auto;width:100%;max-width:520px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(246,245,240,0))}
  .btn{width:100%;border:0;border-radius:16px;background:var(--coral);color:#fff;font-weight:600;font-size:16px;padding:15px 18px;cursor:pointer;text-decoration:none;
    display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 12px 24px -12px rgba(232,87,47,.85)}
  .btn:hover{background:var(--coral-dk)}
  .btn.c{justify-content:center}
  .btn:disabled{background:#c9c7bf;box-shadow:none;cursor:not-allowed}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;margin-top:10px;font-weight:500}
  .btn.ghost:hover{background:var(--sunk)}
  .badge{background:#fff;color:var(--coral);border-radius:999px;min-width:26px;height:26px;padding:0 6px;display:inline-grid;place-items:center;font-size:13px;font-weight:700;margin-right:10px}
  .bl{display:flex;align-items:center}

  /* ---------- ตะกร้า / ชำระเงิน ---------- */
  /* ---------- ตะกร้า ---------- */
  .cbar{position:sticky;top:0;z-index:7;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:rgba(246,245,240,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:520px;margin:0 auto}
  .cback{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
  .cbar .ct{text-align:center} .cbar .ct b{display:block;font-size:17px} .cbar .ct span{font-size:12.5px;color:var(--muted)}
  .cbox{background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin-top:12px;overflow:hidden}
  .cbox.pad{padding:16px 16px 18px}
  .cbox h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:16px;color:var(--ink)}
  .cbox h3 svg{color:var(--mint-deep)}
  .citem{display:flex;gap:12px;padding:14px 14px 14px;border-bottom:1px solid var(--line);position:relative}
  .cimg{flex:0 0 76px;height:76px;border-radius:14px;border:1px solid var(--line);background:#fff;position:relative;overflow:hidden;cursor:pointer}
  .cimg img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain}
  .cimg .ph{inset:4px;font-size:0}
  .cinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding-right:26px}
  .cinfo .cbn{font-size:11.5px;color:var(--mint-deep);font-weight:600;letter-spacing:.3px}
  .cinfo b{font-size:14.5px;line-height:1.3;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cinfo .cup{font-size:12.5px;color:var(--muted)}
  .crow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
  .csum{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
  .crm{position:absolute;top:10px;right:8px;width:32px;height:32px;border:0;background:none;border-radius:50%;color:#a9afba;cursor:pointer;display:grid;place-items:center}
  .crm:hover,.crm:active{background:var(--bad-bg);color:var(--bad)}
  .addmore{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;background:none;padding:13px;color:var(--mint-deep);font-weight:500;cursor:pointer}
  .srow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-variant-numeric:tabular-nums}
  .srow.muted{font-size:13px;color:var(--muted)}
  .price.sale{color:var(--coral);display:inline-flex;align-items:baseline;gap:5px;flex-wrap:wrap}
  .price.sale s{color:var(--muted);font-weight:400;font-size:12.5px}
  .seller{margin:14px auto 0;max-width:520px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.6;display:flex;flex-direction:column;gap:1px}
  .seller b{color:var(--ink2);font-weight:600;font-size:13px}
  .slabel{display:inline-block;align-self:flex-start;margin-top:4px;background:var(--coral-soft);color:var(--coral-dk);font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;line-height:1.4}

<body>
<div class="frame">
  <div id="note"></div>
  <div id="app"></div>
  <div class="bar" id="bar"></div>
  <div id="ov"></div>
</div>
<div id="staffbtn"></div>

<script type="text/x-shop" id="shopmain">
const BOOT = window.__BOOT;
const CAT = BOOT.catalog, SHOP = CAT.shop, BRANDS = CAT.brands, PRODUCTS = CAT.products;
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem('qrshop.'+k)); } catch(e){ return null; } },
  set(k, v){ try { v == null ? localStorage.removeItem('qrshop.'+k) : localStorage.setItem('qrshop.'+k, JSON.stringify(v)); } catch(e){} }
};
const blank = () => ({name:'',company:'',phone:'',tax:false,tname:'',taddr:'',tid:'',tbranch:''});
const state = {
  step:'catalog', cart:{}, form: {...blank(), ...(LS.get('form') || {})}, err:'', busy:false, detail:null,
  page: 'shop', // shop = รายการสินค้า (หน้าแรก = ทุกแบรนด์), brands = หน้าเลือกแบรนด์
  brand: BRANDS.some(b => b.id === BOOT.brand) ? BOOT.brand : 'all',
  q: '', cat: 'all', drawer: false,
  order: null,   // {no, key} ออเดอร์ที่กำลังรอจ่ายหรือจ่ายแล้ว
  info: null,    // สถานะล่าสุดจากเซิร์ฟเวอร์
  coupon: LS.get('coupon'), cpIn: '', cpErr: '', cpBusy: false, // คูปองที่ใช้อยู่ (ตรวจซ้ำที่เซิร์ฟเวอร์ตอนสร้างออเดอร์)
  // ภาษา: เลือกเองแล้วจำไว้ ครั้งแรกใช้ภาษาของเครื่อง (ไทย = th, อื่น ๆ = en)
  lang: (() => { const v = LS.get('lang'); return v === 'th' || v === 'en' ? v : (/^th/i.test(navigator.language || '') ? 'th' : 'en'); })()
};
/** ข้อความตามภาษา: L('ไทย', 'English') */
const L = (th, en) => state.lang === 'en' ? en : th;
const SALE_LABEL_EN = {'ราคาพิเศษเฉพาะซื้อที่บริษัท': 'Special in-office price'};
// ข้อมูลสินค้า/แบรนด์ 2 ภาษา: เก็บภาษาไทยไว้ แล้วสลับช่องที่แสดงตามภาษา (ช่องอังกฤษว่าง = ใช้ภาษาไทย)
PRODUCTS.forEach(p => { p.th = {name:p.name, desc:p.desc, cat:p.cat, info:p.info, saleLabel:p.saleLabel || ''}; });
BRANDS.forEach(b => { b.thTag = b.tag; });
function applyLang(){
  const en = state.lang === 'en';
  PRODUCTS.forEach(p => {
    p.name = en && p.nameEn || p.th.name; p.desc = en && p.descEn || p.th.desc; p.cat = en && p.catEn || p.th.cat;
    p.info = en && p.infoEn && p.infoEn.length ? p.infoEn : p.th.info;
    p.saleLabel = en ? (SALE_LABEL_EN[p.th.saleLabel] || p.th.saleLabel) : p.th.saleLabel;
  });
  BRANDS.forEach(b => { b.tag = en && b.tagEn || b.thTag; });
  document.documentElement.lang = state.lang;
}
function setLang(v){
  if (v === state.lang) return;
  if (state.step === 'cart') saveForm();
  if (state.help) readHelp();
  state.lang = v; LS.set('lang', v); state.cat = 'all'; applyLang(); render();
}
const langSeg = cls => `<span class="lang ${cls || ''}" role="group" aria-label="Language"><button class="${state.lang === 'th' ? 'on' : ''}" onclick="setLang('th')">TH</button><button class="${state.lang === 'en' ? 'on' : ''}" onclick="setLang('en')">EN</button></span>`;
applyLang();
// ตะกร้าเก็บไว้ในเครื่อง ตัดสินค้าที่ไม่มีแล้วหรือยังไม่มีราคาออก
(function(){ const c = LS.get('cart') || {};
  PRODUCTS.forEach(p => { if (p.price != null && c[p.id] > 0) state.cart[p.id] = Math.min(99, c[p.id] | 0); }); })();

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const baht = n => state.lang === 'en' ? num(n) + ' THB' : num(n) + ' บาท';
const pad = n => String(n).padStart(2,'0');
const TM = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TM_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const thTime = ms => { const d = new Date(ms); return state.lang === 'en' ? d.getDate()+' '+TM_EN[d.getMonth()]+' '+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())
  : d.getDate()+' '+TM[d.getMonth()]+' '+(d.getFullYear()+543)+' '+pad(d.getHours())+':'+pad(d.getMinutes()); };
const bname = id => (BRANDS.find(b => b.id === id) || {name:''}).name;
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
function totals(sum){ // ต้องตรงกับ totals_ ฝั่งเซิร์ฟเวอร์
  const rate = SHOP.vatRate; sum = r2(sum);
  if (SHOP.vatIncluded){ const vat = r2(sum*rate/(100+rate)); return {subtotal:r2(sum-vat), vat, total:sum}; }
  const vat = r2(sum*rate/100); return {subtotal:sum, vat, total:r2(sum+vat)};
}
const lines = () => PRODUCTS.filter(p => state.cart[p.id] > 0).map(p => ({...p, qty:state.cart[p.id], sum:p.price*state.cart[p.id]}));
const count = () => lines().reduce((a,l) => a + l.qty, 0);
/** ส่วนลดคูปอง (ต้องตรงกับ couponDiscount_ ฝั่งเซิร์ฟเวอร์) */
function couponDisc(c, gross){
  if (!c || gross < (c.min || 0)) return 0;
  let d = c.type === 'percent' ? r2(gross * c.value / 100) : c.value;
  if (c.type === 'percent' && c.max) d = Math.min(d, c.max);
  return r2(Math.min(d, gross));
}
const cartTotals = () => { const gross = r2(lines().reduce((a,l) => a + l.sum, 0)), discount = couponDisc(state.coupon, gross);
  return {...totals(gross - discount), gross, discount}; };
const pct = p => Math.round((1 - p.price / p.was) * 100);
const pimg = p => p.img ? `<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy">` : `<span class="ph">${L('ไม่มีรูป', 'No image')}</span>`;
const svg = (d, s) => `<svg width="${s||18}" height="${s||18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>', back:'<path d="M15 18l-6-6 6-6"/>', next:'<path d="M9 18l6-6-6-6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>', receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>', filter:'<path d="M4 6h16M7 12h10M10 18h4"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', bag:'<path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 016 0"/>', grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>'
};

/** ผู้ขาย: ให้ลูกค้ารู้ก่อนจ่ายว่าจ่ายให้ใคร */
function sellerFoot(){
  const s = SHOP.seller || {};

  return `<div class="seller"><b>${L('จำหน่ายโดย', 'Sold by')} ${esc(s.name)}</b>
    ${s.tid ? `<span>${L('เลขประจำตัวผู้เสียภาษี', 'Tax ID')} ${esc(s.tid)}${s.branch ? ' · ' + esc(s.branch) : ''}</span>` : ''}
    ${s.addr ? `<span>${esc(s.addr)}</span>` : ''}
    ${contact ? `<span>${L('ติดต่อ', 'Contact')} ${esc(contact)}</span>` : ''}</div>`;
}

function call(fn, ...args){
  return shopApi(fn, args);
}

function go(step){ state.step = step; state.err = ''; state.detail = null; render(); window.scrollTo(0,0); }
function qty(id, d){
  if (state.step === 'cart') saveForm(); // เก็บข้อมูลที่พิมพ์ในฟอร์มไว้ก่อนวาดหน้าใหม่
  state.cart[id] = Math.max(0, Math.min(99, (state.cart[id]||0) + d)); if (!state.cart[id]) delete state.cart[id]; LS.set('cart', state.cart); render(); }
/** พิมพ์จำนวนเอง: ช่องว่าง = คงค่าเดิม, 0 = เอาออกจากตะกร้า, สูงสุด 99 */
function setQty(id, v){
  const digits = String(v).replace(/\D/g, '');
  if (digits === '') return render();
  qty(id, Math.min(99, parseInt(digits, 10)) - (state.cart[id] || 0));
}
function show(id){ state.detail = id; render(); }
function openBrand(id){ state.page = 'shop'; state.brand = id; state.cat = 'all'; state.q = ''; go('catalog'); }
function openCat(c){ state.page = 'shop'; state.brand = 'all'; state.cat = c; state.q = ''; go('catalog'); }
function goAll(){ state.page = 'shop'; state.brand = 'all'; state.cat = 'all'; state.q = ''; go('catalog'); }
function goBrands(){ state.page = 'brands'; state.q = ''; go('catalog'); }
function setCat(c){ state.cat = c; state.drawer = false; render(); window.scrollTo(0, 0); }
/** เลือกแบรนด์จากแถบข้าง: อยู่หน้าเดิม คงคำค้นไว้ */
function pickBrand(id){ state.page = 'shop'; state.brand = id; state.cat = 'all'; state.drawer = false; render(); window.scrollTo(0, 0); }
function setDrawer(v){ state.drawer = v; render(); }
/** พิมพ์ค้นหา: หน้าแรกพิมพ์แล้วไปหน้าผลค้นหาทุกแบรนด์ (คงเคอร์เซอร์ไว้ในช่อง) */
let qTimer = null;
function onSearch(v){
  state.q = v;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    if (state.page === 'brands' && v.trim()) { state.page = 'shop'; state.brand = 'all'; state.cat = 'all'; }
    render();
    const el = $('q'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 220);
}
function clearSearch(){ state.q = ''; render(); const el = $('q'); if (el) el.focus(); }

const norm = s => String(s || '').toLowerCase();
const matchQ = (p, q) => !q || norm([p.th.name, p.nameEn, p.th.desc, p.descEn, p.size, p.th.cat, p.catEn, bname(p.brand), p.act.join(' ')].join(' ')).includes(q);
const catsOf = ps => { const m = {}; ps.forEach(p => { if (p.cat) m[p.cat] = (m[p.cat] || 0) + 1; }); return Object.keys(m).map(k => ({name:k, n:m[k]})); };

function render(){
  const notes = [];
  if (SHOP.sandbox) notes.push(L('โหมดทดสอบ (ChillPay sandbox) ไม่มีการตัดเงินจริง', 'Test mode (ChillPay sandbox): no real charges'));
  if (!SHOP.open) notes.push(closedMsg());
  $('note').innerHTML = notes.map(n => `<div class="banner">${esc(n)}</div>`).join('');
  const v = state.step === 'catalog' ? (state.page === 'brands' ? brandsView() : shopView())
    : {cart:cartView, wait:waitView, done:doneView, ended:endedView}[state.step]();
  document.body.dataset.step = state.step;
  $('app').innerHTML = v.main;
  $('bar').innerHTML = v.bar ? '<div>'+v.bar+'</div>' : '';
  $('ov').innerHTML = state.help ? helpView() : state.rcOpen && state.rc && state.step === 'done' ? rcView() : state.detail ? detailView(PRODUCTS.find(p => p.id === state.detail)) : state.drawer && state.step === 'catalog' ? drawerView() : '';
}

const closedMsg = () => L(SHOP.closedMsg, SHOP.closedMsgEn || 'Not open for sale yet');
/** ปุ่มตะกร้าด้านล่าง ใช้ร่วมกันทั้งหน้าแรกและหน้าสินค้า */
function cartBar(){
  if (!SHOP.open) return `<button class="btn c" disabled>${esc(closedMsg())}</button>`;
  const n = count();
  return n ? `<button class="btn" onclick="go('cart')"><span class="bl"><span class="badge">${n}</span>${L('ดูตะกร้า', 'View cart')}</span><span>${baht(cartTotals().total)}</span></button>` : '';
}
const searchBox = ph => `<label class="search">${svg(I.search)}<input type="text" id="q" placeholder="${ph}" value="${esc(state.q)}" oninput="onSearch(this.value)" autocomplete="off">
  ${state.q ? `<button class="clear" onclick="clearSearch()" aria-label="${L('ล้างคำค้น', 'Clear search')}">${svg(I.x, 14)}</button>` : ''}</label>`;

// ---------------------------------------------------------------- หน้าแรก: เลือกแบรนด์

function brandCards(){
  return `<div class="bgrid">${BRANDS.map(b => { const n = PRODUCTS.filter(p => p.brand === b.id).length;
    return `<button class="bcard ${b.hero ? '' : 'noimg'}" onclick="openBrand('${esc(b.id)}')" aria-label="${L('ดูสินค้า', 'Shop')} ${esc(b.name)}">
      ${b.hero ? `<img src="${esc(b.hero)}" alt="" loading="lazy">` : ''}<span class="shade"></span>
      <span class="txt"><span><b>${esc(b.name)}</b><span>${esc(b.tag)}${b.tag ? ' · ' : ''}${n} ${L('สินค้า', n === 1 ? 'product' : 'products')}</span></span>
        <span class="go">${L('ดูสินค้า', 'Shop')}${svg(I.next, 15)}</span></span></button>`; }).join('')}</div>`;

function brandsView(){
  const main = `<div class="hero plain"><button class="back" onclick="goAll()">${svg(I.back, 16)}${L('สินค้าทั้งหมด', 'All products')}</button>${langSeg('onhero')}
      <div class="t"><b>${L('เลือกแบรนด์', 'Choose a brand')}</b><span>${BRANDS.length} ${L('แบรนด์', BRANDS.length === 1 ? 'brand' : 'brands')} · ${PRODUCTS.length} ${L('สินค้า', PRODUCTS.length === 1 ? 'product' : 'products')}</span></div></div>

// ---------------------------------------------------------------- หน้าสินค้า (แบรนด์เดียว หรือทุกแบรนด์)

function stepper(p){
  if (p.price == null) return `<span class="soon">${L('เร็ว ๆ นี้', 'Coming soon')}</span>`;
  if (!SHOP.open) return '';
  const q = state.cart[p.id] || 0, id = esc(p.id);
  return q ? `<div class="stp"><button onclick="qty('${id}',-1)" aria-label="${L('ลดจำนวน', 'Decrease')}">−</button><input class="qn" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="${q}" aria-label="${L('จำนวน', 'Quantity')} ${esc(p.name)}"
             onfocus="this.select()" onkeydown="if(event.key==='Enter')this.blur()" oninput="this.value=this.value.replace(/\\D/g,'')" onchange="setQty('${id}', this.value)"><button class="p" onclick="qty('${id}',1)" aria-label="${L('เพิ่มจำนวน', 'Increase')}">+</button></div>`
           : `<button class="add" onclick="qty('${id}',1)" aria-label="${L('เพิ่ม ' + esc(p.name) + ' ลงตะกร้า', 'Add ' + esc(p.name) + ' to cart')}">${svg(I.plus, 20)}</button>`;
}
const priceTag = p => p.price == null ? `<span class="note">${L('ยังไม่กำหนดราคา', 'Price not set')}</span>`
  : p.was ? `<span class="price sale"><s>${p.was.toLocaleString('th-TH')}</s>${p.price.toLocaleString('th-TH')} <small>${L('บาท', 'THB')}</small></span>`
  : `<span class="price">${p.price.toLocaleString('th-TH')} <small>${L('บาท', 'THB')}</small></span>`;
const saleBadge = p => p.was ? `<span class="salebadge">-${pct(p)}%</span>` : '';

function cardHtml(p, showBrand){
  const id = esc(p.id);
  const meta = [showBrand ? `<span class="bn">${esc(bname(p.brand))}</span>` : '', p.cat ? `<span class="ct">${esc(p.cat)}</span>` : ''].filter(Boolean).join('<span class="dotsep">·</span>');
  return `<div class="card"><div class="pic" onclick="show('${id}')">${pimg(p)}${saleBadge(p)}</div>
      <div class="body">${meta ? `<span class="meta">${meta}</span>` : ''}<b onclick="show('${id}')">${esc(p.name)}</b>
        <span class="sz">${esc([p.desc, p.size].filter(Boolean).join(' · '))}</span>${p.saleLabel ? `<span class="slabel">${esc(p.saleLabel)}</span>` : ''}

/** แถบตัวกรองด้านข้าง: แบรนด์ และหมวดสินค้า (ใช้ทั้งแถบซ้ายบนจอใหญ่และลิ้นชักบนมือถือ) */
function filterPanel(){
  const b = BRANDS.find(x => x.id === state.brand), q = norm(state.q).trim();
  const scope = PRODUCTS.filter(p => !b || p.brand === b.id), cats = catsOf(scope);

      ${BRANDS.map(x => `<button class="${b && b.id === x.id ? 'on' : ''}" onclick="pickBrand('${esc(x.id)}')">
        <span class="bi">${x.hero ? `<img src="${esc(x.hero)}" alt="">` : `<i>${esc(x.name.charAt(0))}</i>`}</span><span>${esc(x.name)}</span><small>${nb(x.id)}</small></button>`).join('')}
      ${BRANDS.length > 1 ? `<a class="fl" onclick="goBrands()">${L('ดูหน้าแบรนด์ทั้งหมด', 'See all brands')} ›</a>` : ''}
    ${cats.length ? `<h4>${L('หมวดสินค้า', 'Categories')}${b ? ` <span>${L('ใน', 'in')} ${esc(b.name)}</span>` : ''}</h4>
      <button class="${state.cat === 'all' ? 'on' : ''}" onclick="setCat('all')"><span>${L('ทุกหมวด', 'All categories')}</span><small>${scope.length}</small></button>
      ${cats.map(c => `<button class="${state.cat === c.name ? 'on' : ''}" onclick="setCat('${esc(c.name)}')"><span>${esc(c.name)}</span><small>${c.n}</small></button>`).join('')}` : ''}
  </div>`;
}
function drawerView(){
  const n = shopList().length;
  return `<div class="ov side" onclick="if(event.target===this)setDrawer(false)"><div class="drawer" role="dialog" aria-label="${L('เลือกแบรนด์และหมวด', 'Brands and categories')}">
    <div class="dh"><b>${L('แบรนด์ · หมวด', 'Brands · Categories')}</b><button class="x" onclick="setDrawer(false)" aria-label="${L('ปิด', 'Close')}">${svg(I.x)}</button></div>
    ${filterPanel()}
    <div class="df"><button class="btn c" onclick="setDrawer(false)">${L('ดูสินค้า ' + n + ' รายการ', 'Show ' + n + ' products')}</button></div></div></div>`;
}
/** รายการสินค้าตามแบรนด์ หมวด และคำค้นที่เลือกอยู่ */
function shopList(){
  const b = BRANDS.find(x => x.id === state.brand), q = norm(state.q).trim();
  const scope = PRODUCTS.filter(p => !b || p.brand === b.id);
  if (state.cat !== 'all' && !catsOf(scope).some(c => c.name === state.cat)) state.cat = 'all';
  return scope.filter(p => (state.cat === 'all' || p.cat === state.cat) && matchQ(p, q));
}
function shopView(){

      <button class="fbtn" onclick="setDrawer(true)" aria-label="${L('เลือกแบรนด์และหมวด', 'Brands and categories')}" title="${L('แบรนด์ · หมวด', 'Brands · Categories')}">${svg(I.filter)}<span>${L('แบรนด์ · หมวด', 'Filter')}</span>${(b ? 1 : 0) + (state.cat !== 'all' ? 1 : 0) ? `<i>${(b ? 1 : 0) + (state.cat !== 'all' ? 1 : 0)}</i>` : ''}</button></div>`;
  const head = !b
    ? `<div class="mast"><div class="mast-in"><div class="mast-t"><div class="eyerow"><span class="eyebrow">${svg(I.bag, 14)}${L('ช้อปที่บริษัท จ่ายผ่านมือถือ', 'Shop on site, pay by phone')}</span>${langSeg()}</div>
        <h1>${esc(SHOP.name)}</h1><p>${esc(L(SHOP.tag || 'สแกน เลือก จ่าย จบในมือถือ', SHOP.tagEn || 'Scan, choose, pay, all on your phone'))} · ${PRODUCTS.length} ${L('สินค้า', PRODUCTS.length === 1 ? 'product' : 'products')} ${BRANDS.length} ${L('แบรนด์', BRANDS.length === 1 ? 'brand' : 'brands')}</p></div>
        <div class="mast-s sticky">${search}</div></div></div>`
    : `<div class="hero ${b.hero ? '' : 'plain'}">${b.hero ? `<img src="${esc(b.hero)}" alt="${esc(b.name)}">` : ''}${back}${langSeg('onhero')}
        <div class="t"><b>${esc(b.name)}</b><span>${esc(b.tag)}</span></div></div>
      <div class="mast-s sticky under">${search}</div>`;
  const active = [b ? `<button onclick="pickBrand('all')">${esc(b.name)}${svg(I.x, 13)}</button>` : '',
    state.cat !== 'all' ? `<button onclick="setCat('all')">${esc(state.cat)}${svg(I.x, 13)}</button>` : ''].join('');
  const main = head + `<main>
    <div class="infobar"><span>${q ? `${L('ผลการค้นหา', 'Results for')} "<b>${esc(state.q.trim())}</b>" · ` : ''}<b>${list.length}</b> ${L('รายการ', list.length === 1 ? 'item' : 'items')}</span>${active ? `<div class="active">${active}</div>` : ''}</div>
    <div class="layout">
      <aside class="sidebar">${filterPanel()}</aside>
      <section class="results">
        ${list.length ? `<div class="grid">${list.map(p => cardHtml(p, !b)).join('')}</div>`
          : `<div class="empty"><b>${L('ไม่พบสินค้า', 'No products found')}</b>${q ? L('ลองคำค้นอื่น หรือ', 'Try another keyword or') : ''} <button class="back" style="position:static;display:inline-flex;margin-top:10px;box-shadow:none;border:1px solid var(--line)" onclick="state.q='';state.cat='all';render()">${L('ดูสินค้าทั้งหมด' + (b ? 'ในแบรนด์นี้' : ''), 'see all products' + (b ? ' in this brand' : ''))}</button></div>`}
        <p class="note" style="margin:18px 0 0;text-align:center">${SHOP.vatIncluded ? L('ราคารวมภาษีมูลค่าเพิ่มแล้ว', 'Prices include VAT') : L('ราคายังไม่รวมภาษีมูลค่าเพิ่ม ', 'Prices exclude VAT ') + SHOP.vatRate + '%'}</p>
        <p class="helpln"><button onclick="openHelp()">${L('มีปัญหาในการสั่งซื้อหรือชำระเงิน? แจ้งเรา', 'Problem with your order or payment? Let us know')}</button></p>
        ${sellerFoot()}
      </section></div></main>`;
  return {main, bar: cartBar() || (SHOP.open ? `<button class="btn c" disabled>${L('เลือกสินค้าเพื่อเริ่ม', 'Choose products to start')}</button>` : '')};

  const item = l => `<div class="citem"><div class="cimg" onclick="show('${esc(l.id)}')">${pimg(l)}</div>
      <div class="cinfo"><span class="cbn">${esc(bname(l.brand))}${l.size ? ' · ' + esc(l.size) : ''}</span>
        <b>${esc(l.name)}</b><span class="cup">${l.was ? `<s>${l.was.toLocaleString('th-TH')}</s> <em>${esc(l.saleLabel || L('ราคาพิเศษ', 'Sale'))}</em> ` : ''}${Number(l.price).toLocaleString('th-TH')} ${L('บาท / ชิ้น', 'THB each')}</span>
        <div class="crow">${stepper(l)}<span class="csum">${num(l.sum)}</span></div></div>
      <button class="crm" onclick="qty('${esc(l.id)}', -${l.qty})" aria-label="${L('เอา ' + esc(l.name) + ' ออกจากตะกร้า', 'Remove ' + esc(l.name))}">${svg(I.trash, 17)}</button></div>`;
  const main = head + `<main class="cgrid">
    <section class="cbox c-items">${ls.map(item).join('')}
      <button class="addmore" onclick="saveForm();go('catalog')">${svg(I.plus, 16)}${L('เลือกสินค้าเพิ่ม', 'Add more products')}</button></section>

    <section class="cbox pad c-sum"><h3>${svg(I.receipt, 18)}${L('สรุปยอด', 'Order summary')}</h3>
      <div class="srow"><span>${L('ราคาสินค้า (' + n + ' ชิ้น)', 'Subtotal (' + n + (n === 1 ? ' piece)' : ' pieces)'))}</span><span>${num(t.gross)}</span></div>
      ${couponBox(t)}
      <div class="srow muted"><span>${L('มูลค่าก่อน VAT', 'Before VAT')}</span><span>${num(t.subtotal)}</span></div>
      <div class="srow muted"><span>VAT ${SHOP.vatRate}%${SHOP.vatIncluded ? L(' (รวมในราคาแล้ว)', ' (included)') : ''}</span><span>${num(t.vat)}</span></div>
      <div class="srow total"><span>${L('ยอดชำระ', 'Total')}</span><span>${baht(t.total)}</span></div>
      <button class="btn c dpay" onclick="toPay()" ${state.busy ? 'disabled' : ''}>${state.busy ? L('กำลังสร้างรายการชำระเงิน…', 'Creating payment…') : L('ชำระเงิน ', 'Pay ') + baht(t.total)}</button>
      <p class="secure dsec">${svg(I.lock, 15)}${L('ชำระผ่าน ChillPay อย่างปลอดภัย', 'Secure payment via ChillPay')}</p></section>

    <section class="cbox pad c-buyer"><h3>${svg(I.user, 18)}${L('ข้อมูลผู้ซื้อ', 'Buyer details')}</h3>
      <p class="note" style="margin:-4px 0 4px">${L('กรอกชื่อผู้จ่าย ชื่อบริษัท หรือทั้งสองช่อง', 'Enter your name, company name, or both')}</p>
      <label for="f_name">${L('ชื่อผู้จ่าย', 'Your name')}</label><input type="text" id="f_name" maxlength="100" autocomplete="name" placeholder="${L('ชื่อ-นามสกุล', 'Full name')}" value="${esc(f.name)}">
      <label for="f_company">${L('ชื่อบริษัท', 'Company')}</label><input type="text" id="f_company" maxlength="200" autocomplete="organization" placeholder="${L('ถ้าซื้อในนามบริษัท', 'If buying for a company')}" value="${esc(f.company)}">
      <label for="f_phone">${L('เบอร์โทร', 'Phone')} <span class="note">${L('(ไม่บังคับ)', '(optional)')}</span></label><input type="tel" id="f_phone" maxlength="20" autocomplete="tel" inputmode="tel" placeholder="08x-xxx-xxxx" value="${esc(f.phone)}">

      <label class="taxsw"><span><b>${L('ต้องการใบกำกับภาษี', 'I need a full tax invoice')}</b><small>${L('เต็มรูป ออกโดยพนักงานหลังชำระเงิน', 'Issued by our staff after payment')}</small></span>
        <input type="checkbox" id="f_tax" ${f.tax ? 'checked' : ''} onchange="toggleTax()"><i></i></label>
      ${f.tax ? `<div class="taxbox">
        <label for="f_tname">${L('ชื่อบุคคล / นิติบุคคล', 'Name (person or company)')}</label><input type="text" id="f_tname" maxlength="200" value="${esc(f.tname)}">
        <label for="f_taddr">${L('ที่อยู่', 'Address')}</label><textarea id="f_taddr" maxlength="400" placeholder="${L('ที่อยู่ตามที่จะให้ระบุในใบกำกับภาษี', 'Address to show on the tax invoice')}">${esc(f.taddr)}</textarea>
        <div class="two"><div><label for="f_tid">${L('เลขผู้เสียภาษี', 'Tax ID')}</label><input type="text" id="f_tid" inputmode="numeric" maxlength="13" placeholder="${L('13 หลัก', '13 digits')}" value="${esc(f.tid)}"></div>
          <div><label for="f_tbranch">${L('สาขา', 'Branch')}</label><input type="text" id="f_tbranch" maxlength="60" placeholder="${L('สำนักงานใหญ่', 'Head office')}" value="${esc(f.tbranch)}"></div></div></div>` : ''}
    </section>
    <div class="c-foot">${state.err ? `<div class="err">${esc(state.err)}</div>` : ''}
    <p class="secure">${svg(I.lock, 15)}${L('ชำระเงินผ่าน ChillPay อย่างปลอดภัย ร้านไม่เห็นข้อมูลบัตรหรือบัญชีของคุณ', 'Secure payment via ChillPay. We never see your card or bank details.')}</p>
    ${sellerFoot()}
    <p class="helpln"><button onclick="openHelp()">${L('มีปัญหาในการสั่งซื้อหรือชำระเงิน? แจ้งเรา', 'Problem with your order or payment? Let us know')}</button></p></div></main>`;
  return {main, bar: state.busy ? `<button class="btn c" disabled>${L('กำลังสร้างรายการชำระเงิน…', 'Creating payment…')}</button>`
    : `<div class="paybar"><div><small>${L('ยอดชำระ', 'Total')}</small><b>${baht(t.total)}</b></div><button class="btn" onclick="toPay()">${L('ชำระเงิน', 'Pay')}${svg(I.next, 18)}</button></div>`};
}
// ---------------------------------------------------------------- โค้ดส่วนลด

function couponBox(t){
  const c = state.coupon;
  if (c) {
    const short = t.gross < (c.min || 0);
    return `<div class="srow disc"><span class="cpn"><b>${esc(c.code)}</b><button onclick="removeCoupon()" aria-label="${L('ไม่ใช้โค้ด', 'Remove code')} ${esc(c.code)}">${svg(I.x, 13)}</button></span>
        <span>${t.discount ? '-' + num(t.discount) : '0.00'}</span></div>
      <p class="cpnote ${short ? 'warn' : ''}">${short ? L(`ซื้อเพิ่มอีก ${num(c.min - t.gross)} บาท เพื่อใช้โค้ดนี้`, `Add ${num(c.min - t.gross)} THB more to use this code`) : esc(L(c.label, c.labelEn || c.label))}</p>`;
  }
  return `<div class="cpbox"><input type="text" id="cp_in" maxlength="20" placeholder="${L('โค้ดส่วนลด', 'Discount code')}" autocomplete="off" autocapitalize="characters" value="${esc(state.cpIn)}"
      onkeydown="if(event.key==='Enter')applyCoupon()"><button onclick="applyCoupon()" ${state.cpBusy ? 'disabled' : ''}>${state.cpBusy ? L('กำลังตรวจ…', 'Checking…') : L('ใช้โค้ด', 'Apply')}</button></div>
    ${state.cpErr ? `<p class="cpnote warn">${esc(state.cpErr)}</p>` : ''}`;
}
function applyCoupon(){
  saveForm();
  const el = $('cp_in'), code = (el ? el.value : state.cpIn).trim();
  state.cpIn = code;
  if (!code) { state.cpErr = L('กรอกโค้ดส่วนลดก่อน', 'Enter a discount code first'); return render(); }
  state.cpBusy = true; state.cpErr = ''; render();
  call('checkCoupon', code, Object.keys(state.cart).map(id => ({id, qty: state.cart[id]})), state.lang).then(c => {
    state.cpBusy = false; state.coupon = {code:c.code, type:c.type, value:c.value, min:c.min, max:c.max, label:c.label, labelEn:c.labelEn};
    state.cpIn = ''; LS.set('coupon', state.coupon); render();
  }).catch(e => { state.cpBusy = false; state.cpErr = e.message; render(); });
}
function removeCoupon(){ saveForm(); state.coupon = null; state.cpErr = ''; LS.set('coupon', null); render(); }

function saveForm(){
  const f = state.form;
  const ci = $('cp_in'); if (ci) state.cpIn = ci.value;
  ['name','company','phone','tname','taddr','tid','tbranch'].forEach(k => { const el = $('f_'+k); if (el) f[k] = el.value.trim(); });
  const t = $('f_tax'); if (t) f.tax = t.checked;
  LS.set('form', {name:f.name, company:f.company, phone:f.phone, tax:false, tname:'', taddr:'', tid:'', tbranch:''}); // ไม่จำข้อมูลภาษีไว้ในเครื่อง
}
function toggleTax(){ saveForm(); const f = state.form; if (f.tax && !f.tname) f.tname = f.company || f.name; render(); }
function fail(msg){ state.err = msg; state.busy = false; render(); }

function toPay(){
  if (state.busy) return;
  saveForm(); const f = state.form;
  if (!f.name && !f.company) return fail(L('กรุณากรอกชื่อผู้จ่ายหรือชื่อบริษัท อย่างน้อยหนึ่งช่อง', 'Please enter your name or company name'));
  if (f.tax){
    if (!f.tname || !f.taddr) return fail(L('กรุณากรอกชื่อและที่อยู่สำหรับใบกำกับภาษี', 'Please enter the name and address for the tax invoice'));
    if (!/^\d{13}$/.test(f.tid)) return fail(L('เลขประจำตัวผู้เสียภาษีต้องเป็นตัวเลข 13 หลัก', 'Tax ID must be 13 digits'));
  }
  // เปิดแท็บใหม่ทันทีตอนกด (ถ้าเปิดหลังรอเซิร์ฟเวอร์ เบราว์เซอร์จะบล็อก) หน้านี้ค้างไว้รอผลการจ่าย
  let w = null;
  try { w = window.open('', '_blank'); if (w) w.document.write('<meta name="viewport" content="width=device-width"><p style="font-family:sans-serif;padding:24px">' + L('กำลังเปิดหน้าชำระเงิน…', 'Opening payment page…') + '</p>'); } catch(e){}
  state.busy = true; state.err = ''; render();
  const cart = Object.keys(state.cart).map(id => ({id, qty: state.cart[id]}));
  call('createOrder', cart, {...f, coupon: state.coupon ? state.coupon.code : '', lang: state.lang}).then(o => {
    state.busy = false;
    state.order = {no:o.no, key:o.key}; state.info = o; LS.set('order', state.order);
    if (w) { try { w.location.href = o.paymentUrl; } catch(e){ w = null; } }
    go('wait'); poll();
  }).catch(e => { if (w) try { w.close(); } catch(_){}; fail(e.message); });
}

// ---------------------------------------------------------------- รอผลการจ่าย

let timer = null;
function poll(){
  clearTimeout(timer);
  if (!state.order || state.step !== 'wait') return;
  call('getOrderStatus', state.order.no, state.order.key).then(o => {
    state.info = o; applyStatus();
  }).catch(() => {}).then(() => { if (state.step === 'wait') timer = setTimeout(poll, document.hidden ? 15000 : 4000); });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.step === 'wait') poll(); });

function applyStatus(){
  const s = state.info.status;
  if (s === 'PAID'){ state.cart = {}; LS.set('cart', null); state.coupon = null; LS.set('coupon', null); go('done'); } // จ่ายแล้ว คูปองไม่ติดไปออเดอร์ถัดไป
  else if (s === 'PENDING'){ if (state.step !== 'wait') go('wait'); else render(); }
  else go('ended');
}

function waitView(){
  const o = state.info;
  const main = `<main class="narrow"><div class="langrow">${langSeg('sm')}</div><h2>${L('ชำระเงินออเดอร์', 'Pay for order')} ${esc(o.no)}</h2><div class="due"><span>${L('ยอดที่ต้องชำระ', 'Amount due')}</span><b>${baht(o.total)}</b></div>
    <div class="sim"><div class="spin"></div><h3>${L('รอการชำระเงิน', 'Waiting for payment')}</h3>
      <p>${L('ชำระเงินในหน้าของ ChillPay ที่เปิดขึ้นมา แล้วกลับมาที่หน้านี้ ระบบจะแสดงผลเองเมื่อได้รับเงิน', 'Pay on the ChillPay page that opened, then come back here. This page updates automatically once payment is received.')}</p>
      <ul class="tips"><li>${L('ใช้มือถือเครื่องนี้: เลือก Mobile Banking หรือ E-wallet ระบบจะเด้งเข้าแอปให้', 'On this phone: choose Mobile Banking or an e-wallet and it will open the app for you')}</li>
        <li>${L('PromptPay QR: ต้องบันทึกภาพ QR แล้วเปิดในแอปธนาคาร', 'PromptPay QR: save the QR image, then open it in your banking app')}</li>
        ${o.expires ? `<li>${L('ลิงก์ชำระเงินใช้ได้ถึง ' + thTime(o.expires).split(' ').pop() + ' น.', 'The payment link is valid until ' + thTime(o.expires).split(' ').pop())}</li>` : ''}</ul></div>
    <a class="btn ghost c" href="${esc(o.paymentUrl)}" target="_blank" rel="noopener">${L('เปิดหน้าชำระเงินอีกครั้ง', 'Open payment page again')}</a>
    <button class="btn ghost c" onclick="poll()">${L('ตรวจสถานะการชำระเงิน', 'Check payment status')}</button>
    <button class="btn ghost c" onclick="cancelOrder()">${L('ยกเลิกและกลับไปแก้ตะกร้า', 'Cancel and edit cart')}</button>
    <p class="helpln"><button onclick="openHelp('paid_not_done')">${L('จ่ายเงินแล้วแต่หน้านี้ไม่เปลี่ยน? แจ้งเรา', 'Paid but this page has not changed? Let us know')}</button></p></main>`;
  return {main, bar:`<a class="btn" href="${esc(o.paymentUrl)}" target="_blank" rel="noopener"><span>${L('ไปหน้าชำระเงิน', 'Go to payment')}</span><span>${baht(o.total)}</span></a>`};
}

function cancelOrder(){
  if (!confirm(L('ยกเลิกรายการชำระเงินนี้? ถ้าจ่ายไปแล้ว ระบบจะแสดงว่าชำระสำเร็จแทน', 'Cancel this payment? If you have already paid, the page will show payment complete instead.'))) return;
  clearTimeout(timer);
  call('cancelOrder', state.order.no, state.order.key).then(o => {
    state.info = o;
    if (o.status === 'PAID') return applyStatus();
    state.order = null; LS.set('order', null); go('cart');
  }).catch(e => { alert(e.message); poll(); });
}

// รูปและชื่อสินค้าตามภาษาที่เลือก (ชื่อในออเดอร์เป็นชื่อ ณ ตอนสั่ง)
const withImg = ls => ls.map(l => { const p = PRODUCTS.find(x => x.id === l.id) || {}; return {...l, img: p.img, name: p.name || l.name}; });

function doneView(){
  const o = state.info;
  const main = `<main class="narrow"><div class="langrow">${langSeg('sm')}</div><div class="ticket"><div class="tick">✓</div><b>${L('ชำระเงินสำเร็จ', 'Payment complete')}</b>
    <div class="ono">${esc(o.no)}</div><p class="note" style="margin:0">${esc(L(SHOP.pickupMsg, SHOP.pickupMsgEn || 'Show this page to our staff to collect your items'))}</p>
    ${summary(withImg(o.items), o)}
    <p class="note">${o.channel ? L('ช่องทาง: ', 'Paid with: ')+esc(o.channel)+' · ' : ''}${o.paidAt ? L('เวลา ', 'at ')+thTime(o.paidAt) : ''}${o.tax ? L(' · ขอใบกำกับภาษี', ' · Tax invoice requested') : ''}</p></div>${rcCard(o)}<p class="helpln"><button onclick="openHelp()">${L('มีปัญหาในการสั่งซื้อหรือชำระเงิน? แจ้งเรา', 'Problem with your order or payment? Let us know')}</button></p></main>`;
  return {main, bar:`<button class="btn c" onclick="again()">${L('สั่งซื้อรายการใหม่', 'Start a new order')}</button>`};
}

function endedView(){
  const o = state.info;
  const msg = {EXPIRED:L('หมดเวลาชำระเงิน', 'Payment time expired'), CANCELLED:L('ยกเลิกรายการแล้ว', 'Order cancelled'), FAILED:L('สร้างรายการชำระเงินไม่สำเร็จ', 'Could not create the payment'),
    REVIEW:L('รายการนี้ต้องให้พนักงานตรวจสอบ', 'Our staff need to check this order')}[o.status] || L('รายการไม่สำเร็จ', 'Order not completed');
  const main = `<main class="narrow"><div class="langrow">${langSeg('sm')}</div><div class="ticket"><div class="tick x">!</div><b>${msg}</b><div class="ono">${esc(o.no)}</div>
    <p class="note">${o.status === 'REVIEW' ? L('กรุณาแจ้งเลขออเดอร์นี้กับพนักงาน', 'Please show this order number to our staff') : L('สินค้ายังอยู่ในตะกร้า กดด้านล่างเพื่อทำรายการใหม่', 'Your items are still in the cart. Tap below to try again.')}</p></div>
    <p class="helpln"><button onclick="openHelp('paid_not_done')">${L('จ่ายเงินไปแล้ว? แจ้งเรา', 'Already paid? Let us know')}</button></p></main>`;
  return {main, bar:`<button class="btn c" onclick="again()">${o.status === 'REVIEW' ? L('กลับหน้าร้าน', 'Back to shop') : L('กลับไปที่ตะกร้า', 'Back to cart')}</button>`};
}

// ---------------------------------------------------------------- ใบเสร็จ (ออกให้ทุกออเดอร์ ลูกค้าเลือกรับหรือไม่รับ)

function rcCard(o){
  const r = o.rc || {}, busy = state.rcBusy ? 'disabled' : '';
  const err = state.rcErr && !state.rcOpen ? `<div class="err">${esc(state.rcErr)}</div>` : '';
  if (r.status === 'REPLACED') return `<p class="note rcno">${L('ออกใบกำกับภาษีเต็มรูปเลขที่ ', 'Full tax invoice issued: ')}${esc(r.replacedBy)}${L(' ให้แล้ว', '')}</p>`;
  if (r.wanted === 'yes') return `<div class="rcbox row"><div><b>${L('ใบเสร็จรับเงิน', 'Receipt')}</b><small>${L('เลขที่', 'No.')} ${esc(r.no)}</small></div>
    <button class="btn" onclick="openRc()" ${busy}>${state.rcBusy ? L('กำลังเปิด…', 'Opening…') : L('ดูใบเสร็จ', 'View receipt')}</button></div>${err}`;
  if (r.wanted === 'no') return `<p class="note rcno">${L('ไม่รับใบเสร็จ', 'No receipt')} · <button class="lnk" onclick="rcChoose('yes')" ${busy}>${state.rcBusy ? L('กำลังเปิด…', 'Opening…') : L('ขอใบเสร็จ', 'Get a receipt')}</button></p>${err}`;
  return `<div class="rcbox"><b>${L('ต้องการใบเสร็จไหม?', 'Would you like a receipt?')}</b><small>${L('ใบเสร็จรับเงิน / ใบกำกับภาษีอย่างย่อ บันทึกเป็น PDF หรือส่งเข้าอีเมลได้', 'Receipt / abbreviated tax invoice. Save as PDF or send to your email.')}</small>
    <div class="rcbtns"><button class="btn ghost" onclick="rcChoose('no')" ${busy}>${L('ไม่ต้องการ', 'No, thanks')}</button>
    <button class="btn" onclick="rcChoose('yes')" ${busy}>${state.rcBusy ? L('กำลังออก…', 'Issuing…') : L('รับใบเสร็จ', 'Yes, please')}</button></div>${err}</div>`;
}
function rcLoaded(r, wanted){
  state.rcBusy = false;
  state.info.rc = {no:r.no, status:r.status, wanted: wanted || r.wanted, emailed:r.emailed, replacedBy:r.replacedBy};
  if (r.html) { state.rc = r; state.rcOpen = true; }
  render();
}
function rcChoose(c){
  if (!state.order) return;
  state.rcBusy = true; state.rcErr = ''; render();
  call('getReceipt', state.order.no, state.order.key, c, state.lang).then(r => rcLoaded(r, c))
    .catch(e => { state.rcBusy = false; state.rcErr = e.message; render(); });
}
function openRc(){
  if (state.rc) { state.rcOpen = true; state.rcErr = ''; state.rcMsg = ''; return render(); }
  rcChoose();
}
function closeRc(){ readRcEmail(); state.rcOpen = false; render(); }
function readRcEmail(){ const i = $('rc_email'); if (i) state.rcEmail = i.value.trim(); }
function rcView(){
  const r = state.rc, left = 3 - (r.emailed || 0);
  return `<div class="ov" onclick="if(event.target===this)closeRc()"><div class="sheet help" role="dialog" aria-label="${L('ใบเสร็จรับเงิน', 'Receipt')}">
    <div class="hh"><b>${L('ใบเสร็จรับเงิน', 'Receipt')}</b><button class="x" onclick="closeRc()" aria-label="${L('ปิด', 'Close')}">${svg(I.x)}</button></div>
    <div class="in"><div class="rcdoc">${r.html}</div>
      <button class="btn c" onclick="window.print()">${L('บันทึก PDF / พิมพ์', 'Save PDF / Print')}</button>
      <p class="note" style="text-align:center;margin:8px 0 14px">${L('หรือแคปหน้าจอเก็บไว้ก็ได้', 'Or take a screenshot')}</p>
      ${left > 0 ? `<label for="rc_email">${L('ส่งใบเสร็จเข้าอีเมล', 'Email this receipt')}</label>
      <div class="rcmail"><input type="email" id="rc_email" maxlength="120" placeholder="name@example.com" autocomplete="email" inputmode="email" value="${esc(state.rcEmail || '')}">
        <button class="btn" onclick="sendRc()" ${state.rcBusy ? 'disabled' : ''}>${state.rcBusy ? L('กำลังส่ง…', 'Sending…') : L('ส่ง', 'Send')}</button></div>` : ''}
      ${state.rcMsg ? `<div class="okmsg">${esc(state.rcMsg)}</div>` : ''}
      ${state.rcErr ? `<div class="err">${esc(state.rcErr)}</div>` : ''}</div></div></div>`;
}
function sendRc(){
  readRcEmail();
  const em = state.rcEmail || '';
  state.rcMsg = '';
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(em)) { state.rcErr = L('กรุณากรอกอีเมลให้ถูกต้อง', 'Please enter a valid email'); return render(); }
  state.rcBusy = true; state.rcErr = ''; render();
  call('emailReceipt', state.order.no, state.order.key, em, state.lang).then(r => {
    state.rc = r; state.rcMsg = L('ส่งใบเสร็จไปที่ ' + em + ' แล้ว (ถ้าไม่เห็น ลองดูในจดหมายขยะ)', 'Receipt sent to ' + em + ' (check your spam folder if you don\'t see it)');
    rcLoaded(r, 'yes');
  }).catch(e => { state.rcBusy = false; state.rcErr = e.message; render(); });
}

function again(){
  const keepCart = state.info && state.info.status !== 'PAID' && state.info.status !== 'REVIEW';
  state.rc = null; state.rcOpen = false; state.rcErr = ''; state.rcMsg = '';
  state.order = null; state.info = null; LS.set('order', null);
  go(keepCart && count() ? 'cart' : 'catalog');
}

// ---------------------------------------------------------------- ลูกค้าแจ้งปัญหา

const HELP_TOPICS = [
  ['paid_not_done', 'จ่ายเงินแล้ว แต่ไม่ขึ้นว่าชำระสำเร็จ', 'I paid but it does not show as paid'],
  ['cannot_pay', 'กดชำระเงินไม่ได้ / ไม่ไปหน้าจ่ายเงิน', 'I cannot pay / the payment page does not open'],
  ['product', 'ข้อมูลสินค้าหรือราคาไม่ถูกต้อง', 'Product info or price is wrong'],
  ['site', 'หน้าเว็บใช้งานไม่ได้ / ช้า', 'The website is not working / slow'],
  ['other', 'อื่น ๆ', 'Other']
];
function openHelp(topic){
  state.help = {topic: topic || '', text:'', contact: [state.form.name, state.form.phone].filter(Boolean).join(' '), err:'', busy:false, done:null};
  render();
}
function readHelp(){ const h = state.help, t = $('h_text'), c = $('h_contact'); if (t) h.text = t.value; if (c) h.contact = c.value; }
function helpTopic(t){ readHelp(); state.help.topic = t; state.help.err = ''; render(); }
function helpView(){
  const h = state.help, orderNo = state.order ? state.order.no : (state.info ? state.info.no : '');
  const close = `<button class="x" onclick="state.help=null;render()" aria-label="${L('ปิด', 'Close')}">${svg(I.x)}</button>`;
  if (h.done) return `<div class="ov" onclick="if(event.target===this){state.help=null;render()}"><div class="sheet help"><div class="hh"><b>${L('ส่งเรื่องแล้ว', 'Report sent')}</b>${close}</div>
    <div class="in" style="text-align:center"><div class="tick" style="margin:6px auto 10px">✓</div>
      <p>${L('ขอบคุณครับ ทางร้านได้รับเรื่องแล้ว', 'Thank you. We have received your report')}${h.topic === 'paid_not_done' || h.topic === 'cannot_pay' ? L(' จะตรวจสอบโดยเร็วที่สุด', ' and will check it as soon as possible') : ''}</p>
      <p class="note" style="margin-top:6px">${L('เลขที่เรื่อง', 'Ref.')} ${esc(h.done)}${orderNo ? L(' · ออเดอร์ ', ' · Order ') + esc(orderNo) : ''} · ${L('ถ้าเร่งด่วน แจ้งพนักงานที่บริษัทได้เลย', 'If urgent, please tell our staff on site')}</p>
      <button class="btn c" style="margin-top:16px" onclick="state.help=null;render()">${L('ปิด', 'Close')}</button></div></div></div>`;
  return `<div class="ov" onclick="if(event.target===this){state.help=null;render()}"><div class="sheet help" role="dialog" aria-label="${L('แจ้งปัญหา', 'Report a problem')}">
    <div class="hh"><b>${L('แจ้งปัญหา', 'Report a problem')}</b>${close}</div>
    <div class="in"><p class="note" style="margin:0 0 10px">${L('เลือกหัวข้อที่ตรงที่สุด ทางร้านจะได้รับเรื่องทันที', 'Choose the closest topic. We will get your report right away.')}</p>
      <div class="topics">${HELP_TOPICS.map(t => `<button class="${h.topic === t[0] ? 'on' : ''}" onclick="helpTopic('${t[0]}')"><i></i>${L(t[1], t[2])}</button>`).join('')}</div>
      <label for="h_text">${L('รายละเอียดเพิ่มเติม', 'More details')} <span class="note">${h.topic === 'other' ? '' : L('(ไม่บังคับ)', '(optional)')}</span></label>
      <textarea id="h_text" maxlength="1000" placeholder="${L('เช่น จ่ายผ่าน K PLUS เวลา 14:30', 'e.g. paid with K PLUS at 14:30')}">${esc(h.text)}</textarea>
      <label for="h_contact">${L('ชื่อหรือเบอร์ติดต่อกลับ', 'Your name or phone')} <span class="note">${L('(ไม่บังคับ)', '(optional)')}</span></label>
      <input type="text" id="h_contact" maxlength="100" value="${esc(h.contact)}">
      ${orderNo ? `<p class="note" style="margin:10px 0 0">${L('แนบเลขออเดอร์ ' + esc(orderNo) + ' ให้แล้ว', 'Order ' + esc(orderNo) + ' is attached')}</p>` : ''}
      ${h.err ? `<div class="err">${esc(h.err)}</div>` : ''}
      <button class="btn c" style="margin-top:14px" onclick="sendHelp()" ${h.busy ? 'disabled' : ''}>${h.busy ? L('กำลังส่ง…', 'Sending…') : L('ส่งเรื่อง', 'Send')}</button></div></div></div>`;
}
function sendHelp(){
  readHelp();
  const h = state.help, orderNo = state.order ? state.order.no : (state.info ? state.info.no : '');
  if (!h.topic) { h.err = L('กรุณาเลือกหัวข้อ', 'Please choose a topic'); return render(); }
  if (h.topic === 'other' && h.text.trim().length < 5) { h.err = L('กรุณาเล่าปัญหาสั้น ๆ', 'Please describe the problem briefly'); return render(); }
  h.busy = true; h.err = ''; render();
  call('reportCustomerIssue', {topic: h.topic, text: h.text, contact: h.contact, orderNo, lang: state.lang,
    context: [navigator.userAgent, 'จอ ' + innerWidth + 'x' + innerHeight, 'ขั้นตอน ' + state.step, 'ภาษา ' + state.lang].join(' · ')})
    .then(r => { h.busy = false; h.done = r.id; render(); })
    .catch(e => { h.busy = false; h.err = e.message; render(); });
}

// ---------------------------------------------------------------- ปุ่มกลับหลังร้าน (เฉพาะเครื่องที่พนักงานล็อกอินอยู่)

(function staffShortcut(){
  let h = null;
  try { h = JSON.parse(localStorage.getItem('qrstaff.hint') || 'null'); } catch(e){}
  if (!h || !h.exp || h.exp < Date.now()) return;
  $('staffbtn').innerHTML = `<a class="staffbtn" href="${esc(BOOT.base)}?view=staff" target="_top">
    ${svg(I.back, 16)}หลังร้าน${h.name ? ' · ' + esc(h.name) : ''}</a>`;
})();

// ---------------------------------------------------------------- เริ่มต้น

(function start(){
  const saved = BOOT.order && BOOT.order.no ? BOOT.order : LS.get('order');
  render();
  if (!saved) return;
  call('getOrderStatus', saved.no, saved.key).then(o => {
    state.order = saved; state.info = o; LS.set('order', saved);
    if (o.status === 'PENDING'){ go('wait'); poll(); } else applyStatus();
  }).catch(() => LS.set('order', null));
})();
</script>

<script>
const SHOP_EXEC = "https://script.google.com/macros/s/AKfycbxi9Q5SFflOy3VO8acx9GLnXzew_LQxnmHxD398Dh7YTUSJfk8tMycsDQiOO9XBxt8k/exec";
function shopApi(fn, args){
  return fetch(SHOP_EXEC, { method: 'POST', body: JSON.stringify({ fn: fn, args: args || [] }) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(j => { if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด'); return j.data; });
}
(function boot(){
  const app = document.getElementById('app');
  const th = !/^en/i.test(navigator.language || '');
  const msg = t => { app.innerHTML = '<div style="padding:64px 24px;text-align:center;color:#6b778c;font-size:15px">' + t + '</div>'; };
  msg(th ? 'กำลังโหลดสินค้า…' : 'Loading products…');
  const q = new URLSearchParams(location.search);
  const load = n => shopApi('getCatalog').catch(e => { if (n > 0) return new Promise(r => setTimeout(r, 1200)).then(() => load(n - 1)); throw e; });
  load(2).then(catalog => {
    window.__BOOT = {
      base: SHOP_EXEC, catalog: catalog,
      brand: String(q.get('brand') || '').toLowerCase(),
      order: q.get('order') ? { no: String(q.get('order')), key: String(q.get('k') || '') } : null
    };
    const s = document.createElement('script');
    s.textContent = document.getElementById('shopmain').textContent;
    document.body.appendChild(s);
  }).catch(() => {
    msg((th ? 'โหลดร้านไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้ว' : 'Could not load the shop. Check your connection and ') +
      ' <a href="" style="color:#1b8a6b">' + (th ? 'ลองใหม่' : 'try again') + '</a>');
  });
})();
</script>
